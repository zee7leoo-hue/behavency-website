    <!-- real addresses for the pop-up pages (/about, /recruitment, /privacy, /programmes) and their tab titles (from the 26 Nov upload folder) -->
    <script>window.BHV_TITLES={"":"Behavency — Manager assessment and development","about":"About Behavency — who we are","recruitment":"Recruitment — Behavency","programmes":"Programmes for managers and teams — Behavency","privacy":"Privacy Policy — Behavency"};(function () {
  if (!/^https?:$/.test(location.protocol)) return;
  // the phone version lives under /m/ (one upload folder for both, 26 Nov)
  var BASE = /^\/m(\/|$)/.test(location.pathname) ? '/m/' : '/';
  var OPEN = { about: '.abp.open, .pab.open', recruitment: '.rcp.open, .prc.open', privacy: '.pvp.open', programmes: '.bc, .tm.tm-page' };
  var STATE = { about: { about: 1 }, recruitment: { rcp: 1 }, privacy: { pvp: 1 } };
  var seg = function () { var s = location.pathname.replace(/\/+$/, '').split('/').pop().replace(/\.html$/, ''); return OPEN[s] ? s : ''; };
  window.bhvH = function () { var s = seg(); return s && s !== 'programmes' ? '#' + s + (location.hash ? '&' + location.hash.slice(1) : '') : location.hash; };

  var push = history.pushState.bind(history), repl = history.replaceState.bind(history);
  var clean = function (url) {
    if (url == null || url === '') return url;
    var u = new URL(url, location.href), m = u.hash.match(/^#(about|recruitment|privacy)(?:&|$)/);
    if (m) return BASE + m[1] + u.search;
    if (seg() && u.pathname === location.pathname) return BASE + u.search + u.hash;
    return url;
  };
  history.pushState = function (s, t, url) { return push(s, t, clean(url)); };
  history.replaceState = function (s, t, url) { return repl(s, t, clean(url)); };

  // arriving straight at a page: put the home page underneath, so Back and the page's close button stay on the site
  var first = seg();
  if (first) {
    repl(null, '', BASE + location.search);
    if (first === 'programmes') {
      var t = setInterval(function () {
        if (window.bhvOpenProgrammes && document.readyState === 'complete' && document.querySelector('#contact')) { clearInterval(t); setTimeout(window.bhvOpenProgrammes, 400); }
      }, 300);
      setTimeout(function () { clearInterval(t); }, 20000);
    } else push(STATE[first], '', BASE + first + location.search);
  }

  // the full programme list gets /programmes while it is open
  var wrapped = false;
  var wrap = function () {
    if (wrapped || !window.bhvOpenProgrammes) return;
    wrapped = true; var openList = window.bhvOpenProgrammes;
    window.bhvOpenProgrammes = function () { var r = openList.apply(this, arguments); repl(history.state, '', BASE + 'programmes' + location.search); return r; };
  };
  var w = setInterval(function () { wrap(); if (wrapped) clearInterval(w); }, 200);
  setTimeout(function () { clearInterval(w); }, 20000);

  // a page closed without Back (menu link, close button): the address goes back to the home page
  var seen = {};
  setInterval(function () {
    var T = window.BHV_TITLES; if (T) { var tt = T[seg()] || T['']; if (document.title !== tt) document.title = tt; }
    var s = seg(); if (!s) return;
    var open = !!document.querySelector(OPEN[s]);
    if (open) { seen[s] = 1; return; }
    if (seen[s]) { seen[s] = 0; repl(history.state, '', BASE + location.search + location.hash); }
  }, 500);
})();</script>

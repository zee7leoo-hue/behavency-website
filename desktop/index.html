<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Behavency — Know your people. Develop what matters.</title>
    <meta name="description" content="Behavency helps organizations assess manager and team effectiveness, identify real development needs, and prove that development worked." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500;1,8..60,600;1,8..60,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Training programmes ("Our programmes"): placed in Build, right after "You choose how your people learn" (#delivery-v2).
         All texts and the programme list are in public/programmes.js. -->
    <script>
      window.BHV_CLEAN = true;
      // phone layout only on phone-size screens; if the window is resized across that size, reload to switch layout
      window.BHV_SITE = innerWidth < 600 ? 'mob' : 'desk';
      addEventListener('resize', () => { if ((innerWidth < 600 ? 'mob' : 'desk') !== window.BHV_SITE) location.reload(); });
    </script>
    <script src="/programmes.js"></script>
    <!-- Stage transitions: a short "chapter" screen before each of the four stages (#identify, #engage, #build, #measure).
         Texts and colours are in public/stage-transitions.js. Started once the page content has rendered. -->
    <!-- The transitions overlap the top of the next section by 110px. These two exceptions stop them covering content:
         on phones none of them overlap, and the Measure one never does (its section starts straight with content). -->
    <style>
      @media (max-width: 760px) { .bhv-ch { margin-bottom: 0 !important; } }
      .bhv-ch[aria-label^="Stage 4 of 4"] { margin-bottom: 0 !important; }
    </style>
    <script src="/stage-transitions.js"></script>
    <script>
      (function () {
        let tries = 0;
        const t = setInterval(() => {
          if (document.querySelector('#identify') && document.querySelector('#measure')) { clearInterval(t); BehavencyStages.init(); }
          else if (++tries > 100) clearInterval(t);
        }, 100);
      })();
    </script>
  </body>
</html>

# One Netlify site for both Behavency websites, on one address:
#   - desktop/ (the desktop site) is served at the root
#   - mobile/  (the phone site)   is built into /m/
#   - the edge function netlify/edge-functions/device.js shows the phone site to phones on the same address
# Both are built by scripts/build-site.sh.

[build]
  command = "bash scripts/build-site.sh"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Font files (desktop/public/fonts/files and mobile/public/fonts/files): their names include the font version and never
# change for the same content, so browsers may keep them for a year, as they did when they came from Google Fonts.
# Without this, every refresh re-checks them and headings briefly show a backup font.
[[headers]]
  for = "/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/m/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

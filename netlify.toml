# One Netlify site for both Behavency websites, on one address:
#   - desktop/ (the desktop site) is served at the root
#   - mobile/  (the phone site)   is built into /m/
#   - the edge function netlify/edge-functions/device.js shows the phone site to phones on the same address
# Both are built by scripts/build-site.sh.

[build]
  command = "bash scripts/build-site.sh"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Font files (desktop/public/fonts/files and mobile/public/fonts/files): their names include the font version and never
# change for the same content, so browsers may keep them for a year, as they did when they came from Google Fonts.
# Without this, every refresh re-checks them and headings briefly show a backup font.
[[headers]]
  for = "/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/m/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# behavency.com/login goes to the platform's log-in page (from the 26 Nov upload folder)
[[redirects]]
  from = "/login"
  to = "https://app.behavency.com/login"
  status = 302

[[redirects]]
  from = "/m/login"
  to = "https://app.behavency.com/login"
  status = 302

# behavency.me (a domain alias of this site) goes to the same page on www.behavency.com, permanently (27 Nov).
# The pages the edge function handles (home, /about, ...) are sent on by device.js itself, because it runs first.
[[redirects]]
  from = "https://behavency.me/*"
  to = "https://www.behavency.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.behavency.me/*"
  to = "https://www.behavency.com/:splat"
  status = 301
  force = true

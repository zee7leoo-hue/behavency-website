    <!-- Netlify Forms reads this hidden copy of the contact form at deploy time; the real form is in src/ContactForm.jsx (used in the contact section and the hero popup) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><input name="phone" /><input name="organization" /><input name="role" /><input name="managers" /><input name="interest" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <!-- From the "Phone Site Final" design (same order): type and section fixes, then the design's scripts (in public/) -->
    <style id="type-v2">/* Subheaders: 17.4px -> 15.6px, line-height 1.45 (compared with monday.com on mobile) */:root .wn-text,:root .pf-sub,:root .id-text,:root .bm-text,:root .bm-areas-sub,:root .eg-sub,:root .eg-lead,:root .jn-sub,:root .ms-text,:root .hm-text,:root .bd-text,:root .hw-text,:root .pk-text,:root .nbm-text{font-size:15.6px!important;line-height:22.6px!important}</style>
    <style id="fixes-v2">
/* Plain section edges: no wave under the platform card, no curved blob in the measure cards */
.pf-wave{display:none!important}
.hm-card:after{display:none!important}
/* "What makes Behavency different": list items in the site's UI type, readable when opened */
:root .df-item{padding:18px 0}
:root .df-n{font-family:Inter,Arial,sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#1a8a7a;line-height:1}
:root .df-row h3{font-family:Inter,Arial,sans-serif;font-size:16.4px;font-weight:600;line-height:22px;letter-spacing:-.012em;color:#15171c;margin:7px 0 0}
:root .df-row button{width:40px;height:40px}
:root .df-line{font-size:15px;line-height:22px;color:#3d4455;margin-top:10px}
:root .df-more{background:none;box-shadow:none;border-radius:0;border-left:2px solid #cfe7e2;padding:2px 0 2px 14px;margin-top:12px;font-size:14.6px;line-height:21.5px;color:#4a5160}
:root .df-close{font-family:Inter,Arial,sans-serif;font-size:15px;line-height:22px;color:#1e3a5f;margin-top:28px}
:root .df-close i{margin-top:11px}
/* Identify numbers row: "Up to" small above the 5; second line wraps instead of running off the edge */
:root .id-stats{margin-right:16px}
:root .id-stat:first-child{width:auto;flex:none;margin-right:2px}
:root .id-stat--b{width:auto;flex:1 1 0;min-width:0}
:root .id-stat--b strong,:root .id-stat--b span{white-space:normal}
:root .id-b5{position:relative}
:root .id-stat .id-upto{position:absolute;left:1px;top:-11px;font-family:Inter,Arial,sans-serif;font-size:12px;line-height:14px;font-weight:600;letter-spacing:.01em;color:#14b8c8;white-space:nowrap}
</style>
